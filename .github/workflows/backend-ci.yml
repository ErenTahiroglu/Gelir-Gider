name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Backend Quality & Release Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gelirgider_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run Quality Gate (Typegen, Typecheck, Lint, Format, Unit Tests)
        run: npm run check

      - name: PostgreSQL Runtime Verification (PGlite)
        run: npm run test:pg

      - name: PostgreSQL Concurrency Verification (Real PostgreSQL)
        env:
          DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/gelirgider_test"
        run: npm run test:pg:real

      - name: Cloudflare Worker Bundle & Deploy Dry-Run
        run: npx wrangler deploy --dry-run

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Verify Schema Drift
        env:
          DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"
        run: npx drizzle-kit generate

      - name: Ensure Clean Working Tree
        run: git diff --exit-code
